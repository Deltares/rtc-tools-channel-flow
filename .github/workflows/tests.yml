name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  # The stack users get today: rtc-tools pins pymoca to the 0.9 series.
  pymoca-0-9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the package version from tags; a shallow
          # checkout yields 0.1.dev1, which fails rtc-tools' >=1.2.0 pin.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e . matplotlib pytest
      - name: Report resolved versions
        run: pip list | grep -E 'pymoca|rtc-tools'
      - name: Test
        run: pytest tests/ -v
        env:
          MPLBACKEND: Agg
          # pymoca's text cache is machine-wide; only Linux honours this.
          XDG_CACHE_HOME: ${{ runner.temp }}/cache

  # pymoca 0.11.2 ahead of the rtc-tools pin being lifted. Installed over the
  # 0.9 stack, so pip reports a dependency conflict and proceeds anyway; the
  # version assertion below is what makes this job meaningful.
  #
  # Both versions are pinned exactly, because each newer release needs its own
  # triage before it can gate a merge:
  #
  # - casadi: pymoca maps Modelica `/` to `MX.__div__` (generator.py OP_MAP),
  #   which casadi 3.8 removed, so every model containing a division fails to
  #   compile. Fixed upstream by pymoca#356, which no release carries yet;
  #   pymoca#357 backported it to 0.9.3, which is why the job above is
  #   uncapped. Drop this cap once a release includes #356 — but note that on
  #   casadi >=3.8 the three pumping-station examples hit the np.allclose
  #   RecursionError that test_examples skips, so dropping the cap turns them
  #   from pass to skip here, as already happens in the 0.9 job above.
  # - pymoca: on 0.12.0, `fill()` fails in the casadi backend because
  #   `get_integer` returns None, stopping 5 of 6 examples at compile time.
  #   Fixed on pymoca master (unreleased); bumping this pin needs a release
  #   that carries that fix.
  pymoca-0-11-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the package version from tags; a shallow
          # checkout yields 0.1.dev1, which fails rtc-tools' >=1.2.0 pin.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install -e . matplotlib pytest
          pip install "pymoca==0.11.2" "casadi<3.8" "rtc-tools-standard-library>=0.1.3"
      - name: Assert pymoca was not downgraded by the rtc-tools pin
        run: |
          python - <<'PY'
          import sys
          import pymoca
          print("pymoca", pymoca.__version__)
          if pymoca.__version__ != "0.11.2":
              sys.exit(f"expected 0.11.2, got {pymoca.__version__}; the "
                       "rtc-tools pin won the resolution and this job would "
                       "silently retest 0.9")
          PY
      - name: Test
        run: pytest tests/ -v
        env:
          MPLBACKEND: Agg
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
